[package]
name = "vsa-optim-rs"
version = "0.1.1"
edition = "2021"
rust-version = "1.92"
license = "MIT"
authors = ["Tyler Zervas <tz-dev@vectorweight.com>"]
description = "Deterministic training optimization using VSA compression and closed-form gradient prediction"
repository = "https://github.com/tzervas/vsa-optim-rs"
homepage = "https://github.com/tzervas/vsa-optim-rs"
documentation = "https://docs.rs/vsa-optim-rs"
readme = "README.md"
keywords = ["machine-learning", "training", "optimization", "vsa", "gradient"]
categories = ["science", "mathematics", "algorithms"]

[dependencies]
trit-vsa = "0.3"
candle-core = { version = "0.9", default-features = false }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
rand_chacha = "0.10"
pyo3 = { version = "0.27", optional = true, features = ["extension-module"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
proptest = "1.4"

[features]
default = []
python = ["dep:pyo3"]

[lib]
name = "vsa_optim_rs"
crate-type = ["lib"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[[bench]]
name = "optim_bench"
harness = false
